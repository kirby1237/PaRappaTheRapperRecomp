; PaRappa uses a digital PSX pad. Default directions come from the D-pad.
; Face/shoulder buttons keep the standard SDL/Xbox mapping; sticks are unbound.
[controller]
enabled = true
device = 0
deadzone = 3277

[mapping]
up = dpup
down = dpdown
left = dpleft
right = dpright
cross = a
circle = b
square = x
triangle = y
l1 = leftshoulder
r1 = rightshoulder
l2 = lefttrigger
r2 = righttrigger
l3 = none
r3 = none
start = start
select = back
ls_up = none
ls_down = none
ls_left = none
ls_right = none
rs_up = none
rs_down = none
rs_left = none
rs_right = none
